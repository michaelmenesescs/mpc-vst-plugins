# dp4: Ensoniq DP/4-inspired hardware faceplate skin.
# Hand-written layout; rendered by tools/build_port.sh in CI (no Docker here).
# PANEL is the hardware faceplate: LCD shows live unit algorithms + routing,
# the DATA wheel edits the master mix (per-unit mix on the unit tabs,
# feedback on ROUTE), A/B/C/D switch via the tab bar.
theme_bg=0a0a0c
theme_panel=141416
theme_line=2c2c30
theme_ink=e8e8e8
theme_ink_dim=a0a0a8
theme_ink_faint=707078
theme_accent=ff9a1f
theme_accent_hi=ffc25e
theme_knob_face=222226
theme_knob_ring=4a4a52
theme_knob_dot=ff9a1f
theme_lcd=17102e
art_css=skin.css
knob_look=metal
toggle_look=led

[tab PANEL]
art file=panel_dp4.svg
readout cx=434 cy=163 w=132 h=40 label="" key=a_algo tsize=18 tcolor=d8ccff talign=center
readout cx=578 cy=163 w=132 h=40 label="" key=b_algo tsize=18 tcolor=d8ccff talign=center
readout cx=722 cy=163 w=132 h=40 label="" key=c_algo tsize=18 tcolor=d8ccff talign=center
readout cx=866 cy=163 w=132 h=40 label="" key=d_algo tsize=18 tcolor=d8ccff talign=center
readout cx=470 cy=222 w=160 h=28 label="" key=ab_route tsize=16 tcolor=d8ccff talign=center
readout cx=645 cy=222 w=160 h=28 label="" key=cd_route tsize=16 tcolor=d8ccff talign=center
readout cx=820 cy=222 w=140 h=28 label="" key=ab_cd tsize=16 tcolor=d8ccff talign=center
knob cx=1080 cy=180 r=58 label="DATA" key=mix ns=0 bw=130 img=hw_dp_wheel.svg
knob cx=130 cy=430 r=26 label="A MIX" key=a_mix ns=0 bw=120 img=hw_dp_k.svg
knob cx=310 cy=430 r=26 label="B MIX" key=b_mix ns=0 bw=120 img=hw_dp_k.svg
knob cx=490 cy=430 r=26 label="C MIX" key=c_mix ns=0 bw=120 img=hw_dp_k.svg
knob cx=670 cy=430 r=26 label="D MIX" key=d_mix ns=0 bw=120 img=hw_dp_k.svg
qlinks "PANEL" = mix,a_mix,b_mix,c_mix,d_mix

