# dp4: DP/4-inspired 4-unit multi-FX. Dark charcoal panel, amber accent.
# Hand-written layout; rendered by tools/build_port.sh in CI (no Docker here).
theme_bg=0e0e10
theme_panel=141416
theme_line=2c2c30
theme_ink=e8e8e8
theme_ink_dim=a0a0a8
theme_ink_faint=707078
theme_accent=ff9a1f
theme_accent_hi=ffc25e
theme_knob_face=222226
theme_knob_ring=4a4a52
theme_knob_dot=ff9a1f

[tab A]
popup cx=290 cy=140 w=380 h=48 label="A" key=a_algo
knob cx=120 cy=340 r=34 label="P1" key=a_p1
knob cx=400 cy=340 r=34 label="P2" key=a_p2
knob cx=680 cy=340 r=34 label="P3" key=a_p3
knob cx=960 cy=340 r=34 label="P4" key=a_p4
knob cx=120 cy=530 r=34 label="P5" key=a_p5
knob cx=400 cy=530 r=34 label="P6" key=a_p6
knob cx=680 cy=530 r=34 label="MIX" key=a_mix
qlinks "A" = a_algo,a_p1,a_p2,a_p3,a_p4,a_p5,a_p6,a_mix

