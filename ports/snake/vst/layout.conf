# snake: cartesian sequencer. Dark panel, orange accent.
# Hand-written layout; rendered by tools/build_port.sh in CI (no Docker here).
theme_bg=141414
theme_panel=1c1c1c
theme_line=333333
theme_ink=e8e8e8
theme_ink_dim=a0a0a0
theme_ink_faint=707070
theme_accent=ff5a1f
theme_accent_hi=ff7a3f
theme_knob_face=2a2a2a
theme_knob_ring=4a4a4a
theme_knob_dot=ff5a1f

