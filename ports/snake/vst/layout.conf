knob cx=710 cy=490 r=32 label="CHANNEL" key=channel
knob cx=950 cy=490 r=32 label="VELOCITY" key=velocity
button cx=1150 cy=490 label="RANDOMIZE" key=randomize
readout cx=230 cy=580 w=440 h=44 label="" key=status
qlinks "CLOCK" = x_rate,y_rate,path,scale,root,gate_len,octave,channel,velocity,randomize
