# sting: generative acid sequencer. Dark panel, acid yellow-green accent.
# Hand-written layout; rendered by tools/build_port.sh in CI (no Docker here).
theme_bg=0e0e0e
theme_panel=161616
theme_line=2e2e2e
theme_ink=e8e8e8
theme_ink_dim=a0a0a0
theme_ink_faint=707070
theme_accent=c8ff2e
theme_accent_hi=e0ff70
theme_knob_face=2a2a2a
theme_knob_ring=4a4a4a
theme_knob_dot=c8ff2e

[tab STING]
knob cx=120 cy=150 r=34 label="SEED" key=seed
knob cx=400 cy=150 r=34 label="DENSITY" key=density
knob cx=680 cy=150 r=34 label="CHAOS" key=chaos
knob cx=960 cy=150 r=34 label="ACCENTS" key=accent_amt
knob cx=120 cy=340 r=34 label="SLIDES" key=slide_prob
knob cx=400 cy=340 r=34 label="GATE" key=gate_len
knob cx=680 cy=340 r=34 label="SWING" key=swing
knob cx=960 cy=340 r=34 label="STEPS" key=steps
knob cx=120 cy=530 r=34 label="OCTAVE" key=octave
knob cx=400 cy=530 r=34 label="CHANNEL" key=channel
knob cx=680 cy=530 r=34 label="VELOCITY" key=velocity
knob cx=960 cy=530 r=34 label="ACC VEL" key=accent_vel
qlinks "STING" = seed,density,chaos,accent_amt,slide_prob,gate_len,swing,steps,octave,channel,velocity,accent_vel

[tab SETUP]
popup cx=230 cy=180 w=260 h=48 label="" key=rate
popup cx=640 cy=180 w=260 h=48 label="" key=scale
popup cx=1020 cy=180 w=220 h=48 label="" key=root
button cx=230 cy=400 label="REGENERATE" key=regenerate
readout cx=640 cy=400 w=440 h=64 label="" key=status
qlinks "SETUP" = rate,scale,root,regenerate
