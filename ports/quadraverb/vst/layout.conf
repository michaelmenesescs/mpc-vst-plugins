# quadraverb: QuadraVerb-inspired multi-FX. Dark blue-grey panel, amber accent.
# Hand-written layout; rendered by tools/build_port.sh in CI (no Docker here).
theme_bg=101018
theme_panel=16161f
theme_line=2e2e3a
theme_ink=e8e8e8
theme_ink_dim=a0a0a8
theme_ink_faint=707078
theme_accent=ffb02e
theme_accent_hi=ffd070
theme_knob_face=26262e
theme_knob_ring=4a4a55
theme_knob_dot=ffb02e

[tab CONFIG]
popup cx=290 cy=140 w=380 h=48 label="" key=config
knob cx=120 cy=340 r=34 label="EQ LOW" key=eq_low
knob cx=400 cy=340 r=34 label="EQ MID" key=eq_mid
knob cx=680 cy=340 r=34 label="MID FREQ" key=eq_midfreq
knob cx=960 cy=340 r=34 label="EQ HIGH" key=eq_high
knob cx=120 cy=530 r=34 label="MASTER MIX" key=mix
qlinks "CONFIG" = config,eq_low,eq_mid,eq_midfreq,eq_high,mix

[tab REVERB]
popup cx=290 cy=140 w=380 h=48 label="" key=rev_type
knob cx=120 cy=340 r=34 label="SIZE" key=rev_size
knob cx=400 cy=340 r=34 label="DECAY" key=rev_decay
knob cx=680 cy=340 r=34 label="DAMP" key=rev_damp
knob cx=960 cy=340 r=34 label="MIX" key=rev_mix
qlinks "REVERB" = rev_type,rev_size,rev_decay,rev_damp,rev_mix

[tab DELAY]
popup cx=290 cy=140 w=380 h=48 label="" key=dly_sync
knob cx=120 cy=340 r=34 label="TIME" key=dly_time
knob cx=400 cy=340 r=34 label="FEEDBACK" key=dly_fb
knob cx=680 cy=340 r=34 label="DAMP" key=dly_damp
knob cx=960 cy=340 r=34 label="MIX" key=dly_mix
qlinks "DELAY" = dly_sync,dly_time,dly_fb,dly_damp,dly_mix

[tab CHORUS]
knob cx=120 cy=150 r=34 label="CHO RATE" key=cho_rate
knob cx=400 cy=150 r=34 label="CHO DEPTH" key=cho_depth
knob cx=680 cy=150 r=34 label="CHO MIX" key=cho_mix
knob cx=120 cy=340 r=34 label="FLA RATE" key=fla_rate
knob cx=400 cy=340 r=34 label="FLA DEPTH" key=fla_depth
knob cx=680 cy=340 r=34 label="FLA FB" key=fla_fb
knob cx=960 cy=340 r=34 label="FLA MIX" key=fla_mix
qlinks "CHORUS" = cho_rate,cho_depth,cho_mix,fla_rate,fla_depth,fla_fb,fla_mix

[tab PHASER]
knob cx=120 cy=150 r=34 label="RATE" key=pha_rate
knob cx=400 cy=150 r=34 label="DEPTH" key=pha_depth
popup cx=680 cy=150 w=200 h=48 label="" key=pha_stages
knob cx=960 cy=150 r=34 label="MIX" key=pha_mix
knob cx=120 cy=340 r=34 label="PITCH ST" key=pit_semi
knob cx=400 cy=340 r=34 label="PITCH MIX" key=pit_mix
qlinks "PHASER" = pha_rate,pha_depth,pha_stages,pha_mix,pit_semi,pit_mix

[tab WEIRD]
knob cx=120 cy=150 r=34 label="RESO FREQ" key=res_freq
knob cx=400 cy=150 r=34 label="RESO RES" key=res_reso
knob cx=680 cy=150 r=34 label="RESO MIX" key=res_mix
knob cx=120 cy=340 r=34 label="RING RATE" key=ring_rate
knob cx=400 cy=340 r=34 label="RING MIX" key=ring_mix
knob cx=680 cy=340 r=34 label="TREM RATE" key=trem_rate
knob cx=960 cy=340 r=34 label="TREM DEPTH" key=trem_depth
popup cx=960 cy=150 w=200 h=48 label="" key=trem_mode
qlinks "WEIRD" = res_freq,res_reso,res_mix,ring_rate,ring_mix,trem_rate,trem_depth,trem_mode
