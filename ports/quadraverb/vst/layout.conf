knob cx=400 cy=340 r=34 label="DECAY" key=rev_decay ns=0 img=hw_qv_k.svg
knob cx=680 cy=340 r=34 label="DAMP" key=rev_damp ns=0 img=hw_qv_k.svg
knob cx=960 cy=340 r=34 label="MIX" key=rev_mix ns=0 img=hw_qv_k.svg
qlinks "REVERB" = rev_type,rev_size,rev_decay,rev_damp,rev_mix

