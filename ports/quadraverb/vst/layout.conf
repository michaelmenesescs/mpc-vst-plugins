# quadraverb: Alesis QuadraVerb-inspired hardware faceplate skin.
# Hand-written layout; rendered by tools/build_port.sh in CI (no Docker here).
# PANEL is the hardware faceplate: LCD shows live config/block readouts,
# the DATA wheel edits the master mix, configs switch via the config popup
# (the block buttons are printed on the faceplate art).
theme_bg=060607
theme_panel=141417
theme_line=2a2a30
theme_ink=e8e8e8
theme_ink_dim=a0a0a8
theme_ink_faint=707078
theme_accent=4a9eff
theme_accent_hi=8dc2ff
theme_knob_face=1e1e24
theme_knob_ring=383842
theme_knob_dot=4a9eff
theme_lcd=0e2a0e
art_css=skin.css
knob_look=metal
toggle_look=led

[tab PANEL]
art file=panel_qv.svg
readout cx=500 cy=162 w=360 h=44 label="" key=config tsize=22 tcolor=8dff8d talign=center
readout cx=410 cy=212 w=170 h=32 label="" key=rev_type tsize=15 tcolor=8dff8d talign=center
readout cx=600 cy=212 w=170 h=32 label="" key=dly_sync tsize=15 tcolor=8dff8d talign=center
popup cx=500 cy=340 w=360 h=48 label="" key=config
knob cx=1155 cy=180 r=55 label="DATA" key=mix ns=0 bw=130 img=hw_qv_wheel.svg
qlinks "PANEL" = mix,config

[tab CONFIG]
art file=panel_qv_config.svg
popup cx=290 cy=140 w=380 h=48 label="" key=config
knob cx=120 cy=340 r=34 label="EQ LOW" key=eq_low ns=0 img=hw_qv_k.svg
knob cx=400 cy=340 r=34 label="EQ MID" key=eq_mid ns=0 img=hw_qv_k.svg
knob cx=680 cy=340 r=34 label="MID FREQ" key=eq_midfreq ns=0 img=hw_qv_k.svg
knob cx=960 cy=340 r=34 label="EQ HIGH" key=eq_high ns=0 img=hw_qv_k.svg
knob cx=120 cy=530 r=34 label="MASTER MIX" key=mix ns=0 img=hw_qv_k.svg
qlinks "CONFIG" = config,eq_low,eq_mid,eq_midfreq,eq_high,mix

